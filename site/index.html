<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>XPortPC status</title>
<link rel="icon" href="data:,">
<meta name="description" content="How many instructions XPortPC handles so far, across the Xbox Series X|S graphics chip and the x64 CPU.">
<style>
:root {
  color-scheme: light;
  --paper: #f7f7f5; --surface: #ffffff; --ink: #1c1e22; --ink-2: #565b64; --rule: #dcdfe3; --rule-2: #c3c7cd;
  --accent: #2f4a8a; --meter: #e3e5e8;
  --serif: "Iowan Old Style", "Sitka Text", Charter, "Bitstream Charter", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --code: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
  --open: 240ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #1d1f23; --surface: #25282d; --ink: #e9e7e2; --ink-2: #a5a9b0; --rule: #34383f; --rule-2: #4a4f57;
    --accent: #a9b9ea; --meter: #34383f;
  }
}
@media (prefers-reduced-motion: reduce) { :root { --open: 0ms; } }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 1.0625rem/1.6 var(--sans); font-variant-numeric: lining-nums; }
a { color: var(--accent); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-weight: 400; }
code, .code { font-family: var(--code); font-size: 0.875em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums lining-nums; }

.page { max-width: 60rem; margin: 0 auto; padding: 0 1.25rem 3rem; }
@media (min-width: 48rem) { .page { padding: 0 2.5rem 4rem; } }

.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 1.5rem 0 0; }
.mast .name { font-family: var(--serif); font-size: 1.375rem; }
.mast a { font-size: 0.9375rem; }

/* The figure */
.figure { padding: 4.5rem 0 3.5rem; }
.figure h1 { font-size: 1rem; font-weight: 600; }
.figure .big { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.25rem 2rem; margin-top: 0.5rem; }
.figure .ratio { font-family: var(--serif); font-size: clamp(3.25rem, 13vw, 6.5rem); line-height: 1; letter-spacing: -0.02em; }
.figure .ratio span { color: var(--ink-2); font-size: 0.5em; letter-spacing: 0; }
.figure .pct { font-family: var(--serif); font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1; }
.bar { height: 6px; border-radius: 3px; background: var(--meter); overflow: hidden; margin-top: 1.75rem; }
.bar i { display: block; height: 100%; background: var(--accent); }
.split { display: flex; gap: 1.5rem; margin-top: 0.75rem; font-size: 0.9375rem; color: var(--ink-2); }
.split b { color: var(--ink); font-weight: 600; }
.figure .missing { margin-top: 0.75rem; color: var(--ink-2); }

/* Filter */
.tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1.5rem; margin-bottom: 1.5rem; }
.filter { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 999px; padding: 0.1875rem; margin: 0; }
.filter legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.filter label { position: relative; }
.filter input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.filter span { display: block; padding: 0.3125rem 0.875rem; border-radius: 999px; font-size: 0.875rem; color: var(--ink-2); }
.filter input:checked + span { background: var(--ink); color: var(--paper); }
.filter input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.key { display: flex; gap: 1.25rem; font-size: 0.875rem; color: var(--ink-2); }
.key span { display: inline-flex; align-items: center; gap: 0.4375rem; }
.mark { flex: none; width: 1.125rem; height: 1.125rem; display: inline-block; }

/* Groups */
.family + .family { margin-top: 2.25rem; }
.family h2 { font-family: var(--serif); font-size: 1.1875rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule-2); }
.groups { list-style: none; margin: 0; padding: 0; }
.groups > li { border-bottom: 1px solid var(--rule); }
.row { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; align-items: baseline;
  grid-template-columns: 1rem 5.25rem minmax(0, 1fr) auto; gap: 0.125rem 0.75rem; padding: 0.75rem 0.25rem; border-radius: 4px; }
div.row { cursor: default; }
.row:hover .g { text-decoration: underline; text-underline-offset: 0.2em; text-decoration-color: var(--rule-2); }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row .chev { width: 0.75rem; height: 0.75rem; align-self: center; color: var(--ink-2); transition: transform var(--open) cubic-bezier(0.2, 0.7, 0.2, 1); }
.row[aria-expanded="true"] .chev { transform: rotate(90deg); }
.row .g { font-weight: 600; }
.row .d { color: var(--ink-2); font-size: 0.9375rem; }
.row .c { text-align: right; white-space: nowrap; font-size: 0.9375rem; font-variant-numeric: tabular-nums lining-nums; }
.row .c b { font-weight: 600; }
.row .meter { grid-column: 2 / -1; height: 3px; background: var(--meter); margin-top: 0.375rem; border-radius: 2px; overflow: hidden; }
.row .meter i { display: block; height: 100%; background: var(--accent); }

.panel { display: grid; grid-template-rows: 0fr; opacity: 0; visibility: hidden;
  transition: grid-template-rows var(--open) cubic-bezier(0.2, 0.7, 0.2, 1), opacity var(--open) ease-out, visibility 0s linear var(--open); }
.panel > div { min-height: 0; overflow: hidden; }
.open > .panel { grid-template-rows: 1fr; opacity: 1; visibility: visible; transition-delay: 0s; }
.forms { list-style: none; margin: 0; padding: 0.25rem 0.25rem 1.25rem 2rem; columns: 13rem auto; column-gap: 2rem; }
.forms li { display: flex; align-items: center; gap: 0.5rem; padding: 0.1875rem 0; break-inside: avoid; font-size: 0.9375rem; }
.forms li.no code { color: var(--ink-2); }
.forms code { overflow-wrap: anywhere; }
.none { padding: 0.25rem 0.25rem 1.25rem 2rem; color: var(--ink-2); font-size: 0.9375rem; }

.stages { margin-top: 3.5rem; }
.stages h2 { font-family: var(--serif); font-size: 1.1875rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule-2); }
.stages table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
.stages th, .stages td { padding: 0.7rem 0.5rem 0.7rem 0; text-align: right; border-bottom: 1px solid var(--rule); }
.stages th:first-child, .stages td:first-child { text-align: left; }
.stages thead th { font-weight: 400; font-size: 0.8125rem; color: var(--ink-2); }
.stages td.off { color: var(--ink-2); }
footer { margin-top: 3.5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 0.875rem;
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.25rem 2rem; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="m-yes" viewBox="0 0 18 18"><path d="M3.5 9.5l3.6 3.4 7.4-7.8" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="m-no" viewBox="0 0 18 18"><path d="M5 9h8" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="chev" viewBox="0 0 12 12"><path d="M4 2.5L7.5 6 4 9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="page">
<header class="mast">
  <p class="name">XPortPC</p>
  <a href="https://github.com/Its3rr0rsWRLD/XPortPC">GitHub</a>
</header>

<main>
<section class="figure" aria-labelledby="h-done">
  <h1 id="h-done">Instructions done</h1>
  <div id="figure" hidden>
    <div class="big"><p class="ratio num" id="ratio"></p><p class="pct num" id="pct"></p></div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <p class="split num"><span>Done <b id="n-done"></b></span><span>Missing <b id="n-missing"></b></span></p>
  </div>
  <p class="missing" id="no-figure">Loading.</p>
</section>

<section aria-label="Every instruction, by group" id="list" hidden>
  <div class="tools">
    <fieldset class="filter" id="filter">
      <legend>Show</legend>
      <label><input type="radio" name="show" value="all" checked><span>All</span></label>
      <label><input type="radio" name="show" value="yes"><span>Done</span></label>
      <label><input type="radio" name="show" value="no"><span>Missing</span></label>
    </fieldset>
    <p class="key" aria-hidden="true"><span><svg class="mark"><use href="#m-yes"/></svg>Done</span><span><svg class="mark"><use href="#m-no"/></svg>Missing</span></p>
  </div>
  <div id="families"></div>
</section>

<section class="stages" aria-labelledby="h-stages" id="stages" hidden>
  <h2 id="h-stages">Shaders, stage by stage</h2>
  <table>
    <thead><tr><th scope="col">Stage</th><th scope="col">Shaders</th><th scope="col">All instructions done</th><th scope="col">Convertible today, at most</th></tr></thead>
    <tbody id="stage-rows"></tbody>
  </table>
</section>
</main>

<footer>
  <p id="updated"></p>
  <p>Never includes games &middot; MIT &middot; based on <a href="https://github.com/R0Y00/Xbox2Windows">Xbox2Windows</a></p>
</footer>
</div>
<script>
(function () {
  "use strict";
  var REPO = "https://github.com/Its3rr0rsWRLD/XPortPC";
  var STALE_DAYS = 14;
  // GPU encoding groups by what they do. Unknown groups land in "Other".
  var FAMILIES = [
    ["Vector math", [["VOP1", "One operand"], ["VOP2", "Two operands"], ["VOP3", "Three operands"], ["VOP3P", "Packed math"],
      ["VOPC", "Comparisons"], ["SDWA", "Sub-register math"], ["DPP16", "Lane sharing"], ["DPP8", "8-lane sharing"]]],
    ["Scalar", [["SOP1", "One operand"], ["SOP2", "Two operands"], ["SOPK", "With constant"], ["SOPC", "Comparisons"], ["SOPP", "Program control"]]],
    ["Memory", [["SMEM", "Scalar loads"], ["MUBUF", "Buffers"], ["MTBUF", "Typed buffers"], ["FLAT", "Global memory"], ["DS", "Shared memory"], ["MIMG", "Textures"]]],
    ["Pixel input and output", [["VINTRP", "Interpolation"], ["EXP", "Output"]]]
  ];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var $ = function (id) { return document.getElementById(id); };
  var nf = new Intl.NumberFormat("en-US");
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  var tpl = document.createElement("template");
  function mark(id) {  // ids are fixed strings in this file, never data
    tpl.innerHTML = '<svg class="' + (id === "chev" ? "chev" : "mark") + '" aria-hidden="true" focusable="false"><use href="#' + id + '"/></svg>';
    return tpl.content.firstChild;
  }
  function isNum() { return Array.prototype.every.call(arguments, function (v) { return typeof v === "number" && isFinite(v); }); }
  function pct(a, b) { return (100 * a / b).toFixed(1) + "%"; }
  function day(iso) {
    var d = new Date(iso);
    return isNaN(d) ? String(iso) : d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
  }

  function figure(s) {
    var g = s.gfx1013 || {}, x = s.x64 || {};
    if (!isNum(g.forms_covered, g.forms_total, x.covered, x.total) || g.forms_total + x.total <= 0) {
      $("no-figure").textContent = "Not available in this status file.";
      return;
    }
    var done = g.forms_covered + x.covered, total = g.forms_total + x.total;
    var r = $("ratio"); r.textContent = nf.format(done); r.appendChild(el("span", "", " / " + nf.format(total)));
    r.setAttribute("aria-label", nf.format(done) + " of " + nf.format(total));
    $("pct").textContent = pct(done, total);
    $("bar").style.width = (100 * done / total) + "%";
    $("n-done").textContent = nf.format(done);
    $("n-missing").textContent = nf.format(total - done);
    $("figure").hidden = false; $("no-figure").hidden = true;
  }

  function list(s) {
    var g = s.gfx1013 || {}, x = s.x64 || {};
    var groups = Array.isArray(g.groups) ? g.groups.filter(function (v) { return v && typeof v.name === "string" && isNum(v.covered, v.total) && v.total > 0; }) : [];
    var byGroup = {};
    if (Array.isArray(g.forms)) g.forms.forEach(function (f) {
      if (f && typeof f.name === "string" && typeof f.group === "string") (byGroup[f.group] = byGroup[f.group] || []).push(f);
    });
    var have = {}; groups.forEach(function (v) { have[v.name] = v; });
    var fams = FAMILIES.map(function (f) {
      return [f[0], f[1].filter(function (m) { return have[m[0]]; }).map(function (m) { var v = have[m[0]]; delete have[m[0]]; return [v, m[1], byGroup[v.name]]; })];
    });
    var rest = Object.keys(have).sort().map(function (k) { return [have[k], "", byGroup[k]]; });
    if (rest.length) fams.push(["Other", rest]);
    if (isNum(x.covered, x.total) && x.total > 0) {
      var xf = Array.isArray(x.forms) ? x.forms.filter(function (f) { return f && typeof f.name === "string"; }) : null;
      fams.push(["CPU", [[{ name: "x64", covered: x.covered, total: x.total }, "Zen 2 instructions", xf]]]);
    }
    if (!fams.some(function (f) { return f[1].length; })) return;

    var host = $("families"), show = "all", panels = [];
    function fill(p) {
      var items = p.items.filter(function (f) { return show === "all" || (show === "yes") === !!f.covered; });
      p.ul.textContent = "";
      p.none.hidden = items.length > 0; p.ul.hidden = items.length === 0;
      var frag = document.createDocumentFragment();
      items.forEach(function (f) {
        var li = el("li", f.covered ? "yes" : "no");
        li.appendChild(mark(f.covered ? "m-yes" : "m-no"));
        li.appendChild(el("code", "", f.name));
        li.appendChild(el("span", "sr", f.covered ? ", done" : ", missing"));
        frag.appendChild(li);
      });
      p.ul.appendChild(frag);
      p.filled = show;
    }
    fams.forEach(function (fam, fi) {
      if (!fam[1].length) return;
      var wrap = el("div", "family");
      var h = el("h2", "", fam[0]); h.id = "fam-" + fi; wrap.appendChild(h);
      var ul = el("ul", "groups"); ul.setAttribute("aria-labelledby", h.id);
      fam[1].forEach(function (t) {
        var v = t[0], items = t[2], li = el("li"), expandable = !!(items && items.length);
        var row = el(expandable ? "button" : "div", "row");
        if (expandable) { row.type = "button"; row.appendChild(mark("chev")); } else row.appendChild(el("span"));
        row.appendChild(el("span", "g", v.name));
        row.appendChild(el("span", "d", t[1]));
        var c = el("span", "c"); c.appendChild(el("b", "", nf.format(v.covered))); c.appendChild(document.createTextNode(" / " + nf.format(v.total)));
        c.appendChild(el("span", "sr", " done")); row.appendChild(c);
        var m = el("span", "meter"); m.setAttribute("aria-hidden", "true");
        var mi = el("i"); mi.style.width = (100 * v.covered / v.total) + "%"; m.appendChild(mi); row.appendChild(m);
        li.appendChild(row);
        if (expandable) {
          var id = "g-" + v.name.replace(/[^A-Za-z0-9]/g, "");
          row.id = id + "-b"; row.setAttribute("aria-expanded", "false"); row.setAttribute("aria-controls", id);
          var panel = el("div", "panel"); panel.id = id; panel.setAttribute("role", "region"); panel.setAttribute("aria-labelledby", row.id);
          var inner = el("div"), fl = el("ul", "forms"), none = el("p", "none", "None in this group.");
          none.hidden = true; inner.appendChild(fl); inner.appendChild(none); panel.appendChild(inner); li.appendChild(panel);
          var p = { ul: fl, none: none, items: items, filled: null, li: li };
          panels.push(p);
          row.addEventListener("click", function () {
            var open = row.getAttribute("aria-expanded") !== "true";
            if (open && p.filled !== show) fill(p);
            row.setAttribute("aria-expanded", String(open));
            li.classList.toggle("open", open);
          });
        }
        ul.appendChild(li);
      });
      wrap.appendChild(ul); host.appendChild(wrap);
    });
    if (panels.length) $("filter").addEventListener("change", function (e) {
      show = e.target.value;
      panels.forEach(function (p) { if (p.li.classList.contains("open")) fill(p); });
    });
    else $("filter").parentNode.hidden = true;
    $("list").hidden = false;
  }

  function stages(s) {
    var c = s.corpus, st = c && c.stages, sup = Array.isArray(s.stages_supported) ? s.stages_supported : [];
    if (!st || typeof st !== "object") return;
    var names = [["pixel", "Pixel"], ["vertex", "Vertex"], ["compute", "Compute"], ["other", "Other"]];
    var body = $("stage-rows"), any = false;
    names.forEach(function (n) {
      var v = st[n[0]];
      if (!v || !isNum(v.shaders, v.all_covered, v.translatable_bound) || v.shaders <= 0) return;
      var on = sup.indexOf(n[0]) >= 0, tr = el("tr");
      var th = el("th", null, n[1]); th.scope = "row"; tr.appendChild(th);
      tr.appendChild(el("td", "num", v.shaders.toLocaleString("en-US")));
      tr.appendChild(el("td", "num", v.all_covered.toLocaleString("en-US")));
      tr.appendChild(on ? el("td", "num", v.translatable_bound.toLocaleString("en-US") + " (" + pct(v.translatable_bound, v.shaders) + ")")
                        : el("td", "off", "Not supported yet"));
      body.appendChild(tr); any = true;
    });
    if (any) $("stages").hidden = false;
  }

  function updated(s) {
    var t = s.tests || {}, c = s.commit || {}, at = t.run_at || c.time, u = $("updated");
    if (!at) return;
    u.appendChild(document.createTextNode("Updated "));
    var tm = el("time", "", day(at)); tm.setAttribute("datetime", at); u.appendChild(tm);
    if ((Date.now() - new Date(at).getTime()) / 864e5 > STALE_DAYS) u.appendChild(document.createTextNode(" (over " + STALE_DAYS + " days ago)"));
    if (c.short && /^[0-9a-f]{7,40}$/.test(c.full || "")) {
      u.appendChild(document.createTextNode(" · "));
      var a = el("a", "code", c.short); a.href = REPO + "/commit/" + c.full; u.appendChild(a);
    }
  }

  fetch("status.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (s) { s = s || {}; figure(s); list(s); stages(s); updated(s); })
    .catch(function () { $("no-figure").textContent = "The status data could not be loaded."; });
})();
</script>
</body>
</html>
