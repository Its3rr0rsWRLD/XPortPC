# Overrides for the shimgen fixture (tests/shimgen/shimgen_fixture.cpp): a test-only family that forwards to
# a source-built stand-in for a PC runtime DLL, a typed stub with an overridden return value, and a spec'd
# implementation forced to a stub.
family = "fixture"
forward_dll = "x2w_shimgen_fakepc.dll"
forward_anchor = "X2WFixtureForwarded"
forward_default = true

[[functions]]
name = "X2WFixtureForwarded"
returns = "int32_t"
params = "int32_t a, int32_t b"
stub_return = "-1"

[[functions]]
name = "X2WFixtureOverridden"
returns = "HRESULT"
params = "uint32_t* value"
out = ["value"]
stub_return = "S_FALSE"

[[functions]]
name = "XUserGetMaxUsers"
mode = "stub"
stub_return = "E_GAMEUSER_NO_DEFAULT_USER"
