name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel-binary:
    name: Assemble and translate gfx1013 fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check the GPU report summary and submit path
        run: python3 -B tests/gpu_report_format_check.py
      - name: Check machine-code inputs with LLVM 15
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends llvm-15
          python3 -B tests/sampled_coverage_check.py binary llvm-mc-15 llvm-objcopy-15 libLLVM-15.so.1
          python3 -B tests/depth_mask_check.py binary llvm-mc-15 llvm-objcopy-15 libLLVM-15.so.1
          python3 -B tests/pixel_aot_check.py binary llvm-mc-15 llvm-objcopy-15 libLLVM-15.so.1
          python3 -B tests/compute_store_check.py binary llvm-mc-15 llvm-objcopy-15 libLLVM-15.so.1
          python3 -B tests/mesh_indexed_check.py binary llvm-mc-15 llvm-objcopy-15 libLLVM-15.so.1
          python3 -B tests/mesh_entry_check.py binary llvm-mc-15 llvm-objcopy-15 libLLVM-15.so.1
          python3 -B tests/ffx_dispatch_aot_check.py llvm-mc-15 llvm-objcopy-15 libLLVM-15.so.1
          LLVM_LIB=libLLVM-15.so.1 LLVM_MC=llvm-mc-15 LLVM_OBJCOPY=llvm-objcopy-15 python3 -B tests/rdna2_tools_check.py
  python-linux:
    name: Run platform-independent Python checks on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - name: Install fixture dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python checks
        run: |
          python -B tests/script_state_check.py
          python -B tests/resource_root_check.py
          python -B tests/bcpack_check.py
          python -B tests/bc7_blocks_check.py
          python -B tests/bc7_tiles_check.py
          python -B tests/form_coverage_check.py
          python -B -I tests/vertex_corpus_report_check.py
          python -B tests/resource_ranges_check.py
          python -B tests/awc_metadata_check.py
          python -B tests/sgd5_effects_check.py
          python -B tests/dxcontainer_part_offsets_check.py
          python -B tests/layout_chunks_check.py
          python -B tests/dependency_paths_check.py
          python -B tests/intake/paths_check.py
          python -B tests/shader_probe_check.py
          python -B tests/dxil_retarget_check.py
          python -B tests/rdna2_tools_check.py
          python -B tests/pso_readiness_check.py
          python -B tests/xmem_attribute_scan_check.py
          python -B tests/docs_links_check.py
          python -B tests/bidi_controls_check.py
  build-and-test:
    name: Build and test on Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install fixture dependencies
        shell: pwsh
        run: |
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\out\pe-env\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Configure, build and run PC tests
        shell: pwsh
        run: |
          .\tools\dev.ps1
          cmake --preset dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset dev --no-tests=error -E '_hardware$' --output-junit "$PWD/out/test-results.xml"
      - name: Draw the coverage dashboard
        shell: pwsh
        run: |
          ./out/pe-env/Scripts/python.exe -B tools/form_coverage.py out/test-results.xml --json out/coverage/coverage.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./out/pe-env/Scripts/python.exe -B tools/coverage_svg.py out/coverage/coverage.json out/coverage/dashboard.svg `
            --source "$($env:GITHUB_SHA.Substring(0, 7)), GitHub Actions windows-2025, WARP"
      - name: Upload coverage dashboard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-dashboard
          path: out/coverage/dashboard.svg
          if-no-files-found: error
      - name: Build and smoke-test the standalone GPU check
        shell: pwsh
        run: .\tools\package-gpu-check.ps1
      - name: Upload verified GPU check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpu-check-windows-x64
          path: |
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip
            out/gpu-check/Xbox2Windows-GpuCheck-win-x64.zip.sha256
          if-no-files-found: error
  build-and-test-release:
    name: Build and test on Windows at /O2
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install fixture dependencies
        shell: pwsh
        run: |
          python -m venv out/pe-env
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\out\pe-env\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Configure, build and run PC tests at /O2
        shell: pwsh
        run: |
          .\tools\dev.ps1
          cmake --preset release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset release --no-tests=error -E '_hardware$'
