# Slots 3-7 and 15-17 are INFERENCE, not trace facts. Observed: the security-information trio at 8-10 (header order:
# Async, ResultSize, Result), and Verify at 14, so 11-13 are the Utf16 trio (same header order) and slots 3-7 are the
# functions the public XNetworking.h lists before them. In the header those are the connectivity-hint group
# (Get, Register, Unregister) and the preferred-UDP-port group (Register..Changed, Unregister..Changed beside it,
# since the Query/QueryAsync/AsyncResult trio is not adjacent in a vtable that puts Verify at 14).
# A title's first networking call was slot 15 with one pointer argument (the other two argument registers hold
# leftovers: 0x7ffffffffffffffc, 0x40): the first function after Verify that takes a single pointer is
# XNetworkingQueryPreferredLocalUdpMultiplayerPort(uint16_t*) - but a later owner run showed the title then reads
# null+0x38 (a lock in an object it expected from this call) with arg1 a stack address, so slot 15 is served as an
# out-parameter that receives a logging object (XNetworkingSlot15Object); 16 and 17 keep the port-query guess.
# 18-20 (QueryConfigurationSetting, SetConfigurationSetting, QueryStatistics, order unknown) stay unmapped: they
# answer E_NOTIMPL, which their documentation lists for a platform that does not support the setting or statistic.
# Each assumption is logged once at the first call ("xgr-assume"), so a wrong guess shows up in the run log.

