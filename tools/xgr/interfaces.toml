# The PC Gaming Runtime's interface layer, as learned from our own evidence (docs/design/runtime.md,
# section 2, "The Gaming Runtime gateway"). tools/xgr_gen.py turns this into the xgameruntime.dll
# gateway's table (src/xgr/xgr_gateway.cpp).
#
# Sources allowed here: x2w_launch --xgr trace runs of Microsoft's public GDK samples (Xbox-GDK-Samples,
# MIT, built by us for PC: cards/standin-titles), with each caller resolved to a function name through
# the PDB of our own build of the sample (dbghelp, tools/pc_jobs/run_xgr.ps1), and the public PC GDK
# NuGet packages (Microsoft.GDK.Core/Windows 2610.0.9661) as facts. No other project's code or docs.
#
# [[classes]]: name (our label), clsid, evidence. interfaces: name, iid, evidence (and optionally slots,
# the number of slots that version has when known). [[classes.slots]]: index (3.. ; 0-2 are IUnknown),
# function (the flat function whose thunk makes this call, or "" when unknown), evidence.
#
# Slots 0-2 are IUnknown; the thunks call slot 2 (Release) after each call. Slots not listed are unknown
# and answer E_NOTIMPL through the gateway's logging thunks. impl = "xgr" marks a function x2w_gdk.dll does
# not have, implemented in src/xgr/xgr_extra.cpp (returns/params give its signature).

# Optional class field: fallback = "NAME" is the HRESULT a slot of this class with no implementation answers
# (instead of E_NOTIMPL): E_NOTIMPL (default), E_GAMEUSER_NO_DEFAULT_USER (XUser: a title treats it as "no user
# yet" and shows its sign-in path, where E_NOTIMPL would read as a runtime fault). The same value is what a
# logging fallback object answers when a known class is queried with an IID this table does not list.

