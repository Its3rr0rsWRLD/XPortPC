# Console audio hardware abstraction. No public documentation: see chad.toml.
# Format: see xgameruntime.toml; `dll` makes tools/shimgen.py --family-dlls generate acphal.dll from this file.
family = "acphal"
dll = "acphal.dll"
undocumented = true
forward_default = false

