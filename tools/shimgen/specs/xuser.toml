# XUser: an offline local user. https://learn.microsoft.com/en-us/gaming/gdk/docs/reference/system/xuser/xuser_members
# Functions whose public pages do not give a full signature (token and signature, gamer picture, UI flows)
# are not listed: shimgen gives them its generic stub, which returns E_NOTIMPL for *Async/*Result names.
# Format: see xgameruntime.toml.
family = "xuser"
forward_dll = "xgameruntime.dll"
forward_anchor = "XUserAddAsync"
forward_default = false
doc_root = "https://learn.microsoft.com/en-us/gaming/gdk/docs/reference/system/xuser/functions/"

